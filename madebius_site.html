(() => {
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false});
const DPR = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
renderer.outputEncoding = THREE.LinearEncoding;   // tone mapping + sRGB done in post pass
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = lin('#08090B');
const BASE_FOV = 32, CAM_Z = 18;
const camera = new THREE.PerspectiveCamera(BASE_FOV, 1, 0.05, 100);
camera.position.set(0, 0, CAM_Z);

// ---------- Lighting: key at 45° from the upper-left ----------
const KEY_DIR = new THREE.Vector3(-1, 1, Math.SQRT2).normalize();   // 45° off the view axis, 45° azimuth
const pmrem = new THREE.PMREMGenerator(renderer);
const env = new THREE.Scene();
env.add(new THREE.Mesh(new THREE.BoxGeometry(40,40,40), new THREE.MeshBasicMaterial({color:0x020202, side:THREE.BackSide})));
function softbox(w, h, pos, b){
  const m = new THREE.MeshBasicMaterial({side:THREE.DoubleSide}); m.color.setRGB(b,b,b);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w,h), m); p.position.copy(pos); p.lookAt(0,0,0); env.add(p);
}
softbox(9, 9, KEY_DIR.clone().multiplyScalar(15), 7);            // main 45° softbox
softbox(2, 12, new THREE.Vector3(13, 4, -6), 2.2);               // cool rim strip
softbox(10, 1.5, new THREE.Vector3(3, -10, 9), 0.6);             // faint floor bounce
scene.environment = pmrem.fromScene(env, 0.02).texture;

const key = new THREE.DirectionalLight(0xffffff, 3.0);
key.position.copy(KEY_DIR).multiplyScalar(16);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, {left:-16, right:16, top:16, bottom:-16, near:1, far:45});
scene.add(key);
const rim = new THREE.DirectionalLight(lin('#C9D6FF'), 1.3); rim.position.set(8, 4, -7); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.22); fill.position.set(6, -4, 8); scene.add(fill);
scene.add(new THREE.HemisphereLight(lin('#8A93A6'), 0x000000, 0.18));

const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(160,160), new THREE.ShadowMaterial({opacity:0.55}));
backdrop.position.z = -2.8; backdrop.receiveShadow = true; scene.add(backdrop);

// ---------- Asterisk geometry ----------
function asteriskGeometry(){
  const L=0.5, tip=0.2, root=0.12, pts=[];
  const rot=(a,x,y)=>new THREE.Vector2(x*Math.cos(a)-y*Math.sin(a), x*Math.sin(a)+y*Math.cos(a));
  for (let k=0;k<6;k++){
    const a=Math.PI/2+k*Math.PI/3;
    pts.push(rot(a,L,-tip/2), rot(a,L,tip/2));
    const b=a+Math.PI/6; pts.push(new THREE.Vector2(root*Math.cos(b), root*Math.sin(b)));
  }
  const g=new THREE.ExtrudeGeometry(new THREE.Shape(pts),{depth:0.26,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.035,bevelSegments:6});
  g.center(); g.computeVertexNormals(); return g;
}
const geo = asteriskGeometry();

// ---------- Materials ----------
const redMat   = new THREE.MeshPhysicalMaterial({color:lin('#FF4B0C'), roughness:0.14, clearcoat:1, clearcoatRoughness:0.03, envMapIntensity:1.6});
const matteMat = new THREE.MeshStandardMaterial({color:lin('#1E2024'), roughness:0.9, metalness:0, envMapIntensity:0.35});
const glossMat = new THREE.MeshPhysicalMaterial({color:lin('#121417'), roughness:0.16, metalness:0, clearcoat:1, clearcoatRoughness:0.04, envMapIntensity:1.5});

// ---------- Grid ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = innerWidth < 760;
const COLS = small ? 5 : 11, ROWS = small ? 9 : 6, GAP = small ? 1.35 : 1.45;
const HERO_SLOT = small ? [2, 3] : [8, 2];
let halfW = 1, halfH = 1;
function layout(){ halfH = CAM_Z*Math.tan(THREE.MathUtils.degToRad(BASE_FOV/2)); halfW = halfH*camera.aspect; }
const slotPos = (c, r) => new THREE.Vector3((c-(COLS-1)/2)*GAP, ((ROWS-1)/2-r)*GAP, 0);

const bodies = [];
function makeBody(hero, home){
  const glossy = !hero && Math.random() < 0.4;
  const mesh = new THREE.Mesh(geo, hero ? redMat : (glossy ? glossMat : matteMat));
  const s = hero ? 1.25 : 1.0;
  mesh.scale.setScalar(s); mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  const b = {mesh, hero, glossy, r:0.47*s, home, p:home.clone(), v:new THREE.Vector3(), w:new THREE.Vector3(), q:new THREE.Quaternion(), hitAt:0};
  bodies.push(b); return b;
}

  const opts = {type:THREE.HalfFloatType, format:THREE.RGBAFormat, depthBuffer:true};
  if (rt) rt.dispose();
  rt = (renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget)
    ? new THREE.WebGLMultisampleRenderTarget(w, h, Object.assign({samples:4}, opts))
    : new THREE.WebGLRenderTarget(w, h, opts);
}

  uniforms:{
    tScene:{value:null}, res:{value:new THREE.Vector2(1,1)},
    shocks:{value:Array.from({length:MAXS}, () => new THREE.Vector4())},
    vortex:{value:0}, swirl:{value:1},
    page2:{value:0}, fade:{value:1}, tLogo:{value:logoTex}, logoRect:{value:new THREE.Vector4(0.14,0.4,0.72,0.2)},

  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    precision highp float;
    uniform sampler2D tScene; uniform vec2 res; uniform vec4 shocks[${MAXS}];
    uniform float vortex; uniform float swirl;
    uniform float page2; uniform float fade; uniform sampler2D tLogo; uniform vec4 logoRect; uniform float logoAlpha; uniform vec3 bg2;
    varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }
    void main(){
      float asp = res.x/res.y;
      vec2 off = vec2(0.); float hl = 0.; float lip = 0.;
      for (int i=0;i<${MAXS};i++){
        vec4 s = shocks[i];
        if (s.w <= 0.001) continue;
        vec2 d = (vUv - s.xy)*vec2(asp,1.);
        float dist = length(d);
        vec2 dir = dist > 1e-4 ? d/dist : vec2(0.);
        float w = 0.055 + s.z*0.05;
        float x = (dist - s.z)/w;
        float g = exp(-x*x);
        float t = x + 2.6;
        float trail = 0.4*exp(-t*t*0.35)*sin(t*2.6);
        off += dir*(-x*g + trail)*s.w*0.05;
        float lit = 0.5 + 0.5*dot(dir, normalize(vec2(-0.707,0.707)));
        float spec = exp(-pow((dist - s.z + w*0.35)/(w*0.12),2.));
        hl += (pow(g,6.)*0.5 + spec*0.9)*lit*s.w;
        lip += g*s.w;
      }
      off.x /= asp;

      vec2 c = vec2(0.5);
      vec2 p = (vUv + off - c)*vec2(asp,1.);
      float r = length(p);
      float a = vortex*vortex*swirl*3.4*exp(-r*1.6);
      float ca = cos(a), sa = sin(a);
      p = vec2(p.x*ca - p.y*sa, p.x*sa + p.y*ca);
      vec2 uv = p/vec2(asp,1.) + c;

      vec3 col = vec3(0.); float A = 0.;
      float blur = vortex*0.09;
      for (int i=0;i<10;i++){
        float k = 1.0 - blur*float(i)/9.0;
        vec2 u = c + (uv - c)*k;
        vec4 base = texture2D(tScene, u);
        col.r += texture2D(tScene, u + off*0.00).r;
        col.g += texture2D(tScene, u + off*0.10).g;
        col.b += texture2D(tScene, u + off*0.22).b;
        A += base.a;
      }
      col /= 10.; A = clamp(A/10., 0., 1.);
      if (page2 > 0.5) col /= max(A, 1e-3);

      col = mix(col, col*vec3(0.92,0.97,1.08), clamp(lip,0.,1.));
      col += vec3(0.8,0.88,1.0)*hl*0.5;
      col = aces(col*1.05);
      vec2 v = vUv - 0.5; float vig = 1. - dot(v,v)*0.45;
      vec3 outc;
      if (page2 > 0.5){
        vec3 sc = pow(col*vig, vec3(1./2.2));
        vec3 bgc = bg2;
        vec2 lu = (vUv - logoRect.xy)/logoRect.zw;
        if (lu.x >= 0. && lu.x <= 1. && lu.y >= 0. && lu.y <= 1.){
          vec4 L = texture2D(tLogo, lu);
          bgc = mix(bgc, L.rgb, L.a*logoAlpha);
        }
        outc = mix(bgc*vig, sc, A)*fade;
      } else {
        float eye = smoothstep(vortex*0.5, vortex*0.5 + 0.28, r);
        col *= mix(1.0, eye, smoothstep(0.15, 0.6, vortex));
        col *= 1.0 - smoothstep(0.8, 0.98, vortex);
        outc = pow(col*vig, vec3(1./2.2));
      }
      gl_FragColor = vec4(outc, 1.);
    }`,

});

const shellMat2  = new THREE.MeshPhysicalMaterial({color:lin('#2B2D32'), roughness:0.5, metalness:0.05, clearcoat:0.25, clearcoatRoughness:0.35, envMapIntensity:0.8});
const trimMat2   = new THREE.MeshPhysicalMaterial({color:lin('#1D1F23'), roughness:0.28, metalness:0.2, clearcoat:0.6, clearcoatRoughness:0.15, envMapIntensity:1.1});
const screenMat2 = new THREE.MeshPhysicalMaterial({color:lin('#040506'), roughness:0.05, metalness:0, clearcoat:1, clearcoatRoughness:0.02, envMapIntensity:1.3});
const eyeMat2    = new THREE.MeshBasicMaterial({color:lin('#FF4B0C').multiplyScalar(2.2), transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false});

const DEPTH = 0.9, FACE_Y = -0.05;
const mascot = new THREE.Group(); scene2.add(mascot);
const profile = new THREE.SplineCurve([
  new THREE.Vector2(0.00,-1.00), new THREE.Vector2(0.90,-1.00), new THREE.Vector2(1.12,-0.86),
  new THREE.Vector2(1.24,-0.40), new THREE.Vector2(1.25, 0.05), new THREE.Vector2(1.18, 0.50),
  new THREE.Vector2(0.95, 0.90), new THREE.Vector2(0.55, 1.12), new THREE.Vector2(0.00, 1.18)
]).getPoints(80);
profile[0].x = 0.0001; profile[profile.length-1].x = 0.0001;
function radiusAt(y){
  for (let i=0;i<profile.length-1;i++){
    const a=profile[i], b=profile[i+1];
    if ((y>=a.y&&y<=b.y)||(y<=a.y&&y>=b.y)){ const t=(y-a.y)/((b.y-a.y)||1e-6); return a.x+(b.x-a.x)*t; }
  }
  return 0.5;
}
const surfaceZ = (x,y) => { const r=radiusAt(y); return DEPTH*Math.sqrt(Math.max(0.0004, r*r - x*x)); };
const headMesh = new THREE.Mesh(new THREE.LatheGeometry(profile, 96), shellMat2);
headMesh.scale.z = DEPTH; mascot.add(headMesh);
function roundedRectPts(w,h,r,perSide){
  const pts=[], hw=w/2, hh=h/2;
  const corners=[[hw-r,hh-r,0],[-hw+r,hh-r,Math.PI/2],[-hw+r,-hh+r,Math.PI],[hw-r,-hh+r,1.5*Math.PI]];
  corners.forEach(([cx,cy,a0],i)=>{
    for (let k=0;k<=12;k++){ const a=a0+k/12*Math.PI/2; pts.push(new THREE.Vector2(cx+r*Math.cos(a), cy+r*Math.sin(a))); }
    const last=pts[pts.length-1];
    const ex = i===0||i===2 ? (i===0?-hw+r:hw-r) : (i===1?-hw:hw);
    const ey = i===0||i===2 ? (i===0?hh:-hh) : (i===1?-hh+r:hh-r);
    for (let k=1;k<perSide;k++){ const t=k/perSide; pts.push(new THREE.Vector2(last.x+(ex-last.x)*t, last.y+(ey-last.y)*t)); }
  });
  return pts;
}
function bendOnto(g, cy, offset){
  const p=g.attributes.position;
  for (let i=0;i<p.count;i++){ const x=p.getX(i), y=p.getY(i)+cy, z=p.getZ(i); p.setXYZ(i, x, y, surfaceZ(x,y)+z+offset); }
  g.computeVertexNormals();
}
const outerShape = new THREE.Shape(roundedRectPts(2.05,1.55,0.5,24));
outerShape.holes.push(new THREE.Path(roundedRectPts(1.72,1.24,0.38,24).reverse()));
const bezelGeo = new THREE.ExtrudeGeometry(outerShape,{depth:0.1,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.05,bevelSegments:6,curveSegments:4});
bendOnto(bezelGeo, FACE_Y, -0.06);
mascot.add(new THREE.Mesh(bezelGeo, shellMat2));
function screenGeometry(w,h,r){
  const g=new THREE.PlaneGeometry(w,h,64,48), p=g.attributes.position, hw=w/2-r, hh=h/2-r;
  for (let i=0;i<p.count;i++){
    let x=p.getX(i), y=p.getY(i);
    const dx=Math.max(Math.abs(x)-hw,0), dy=Math.max(Math.abs(y)-hh,0), d=Math.hypot(dx,dy);
    if (d>r){ const k=r/d; x=Math.sign(x)*(hw+dx*k); y=Math.sign(y)*(hh+dy*k); }
    p.setXY(i,x,y);
  }
  return g;
}
const scrGeo = screenGeometry(1.76,1.28,0.4); bendOnto(scrGeo, FACE_Y, -0.01);
mascot.add(new THREE.Mesh(scrGeo, screenMat2));
const eyes = [];
[-0.36, 0.36].forEach(ex => {
  const eye = new THREE.Mesh(new THREE.TorusGeometry(0.15,0.045,12,32,Math.PI), eyeMat2);
  const ey = FACE_Y + 0.04; eye.position.set(ex, ey, surfaceZ(ex,ey)+0.006);
  eye.rotation.y = Math.asin(Math.max(-0.5, Math.min(0.5, -ex*0.55)));
  mascot.add(eye); eyes.push(eye);
});
function finGeometry(){
  const sh=new THREE.Shape();
  sh.moveTo(-0.2,0); sh.lineTo(0.2,0);
  sh.bezierCurveTo(0.14,0.6, 0.08,1.2, 0.06,1.5);
  sh.quadraticCurveTo(0.0,1.64,-0.07,1.5);
  sh.bezierCurveTo(-0.1,1.1,-0.16,0.5,-0.2,0);
  return new THREE.ExtrudeGeometry(sh,{depth:0.08,bevelEnabled:true,bevelThickness:0.035,bevelSize:0.03,bevelSegments:5,curveSegments:32});
}
function sideCyl(r,h,mat){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,64,1), mat); m.rotation.z=Math.PI/2; return m; }
const fins = [];
function buildEar(side){
  const ear=new THREE.Group(), EY=-0.12, baseX=radiusAt(EY)-0.04;
  const plate=sideCyl(0.5,0.12,shellMat2); plate.scale.set(1.15,1,0.72); plate.position.x=baseX+0.04; ear.add(plate);
  const d1=sideCyl(0.4,0.11,trimMat2); d1.position.x=baseX+0.14; ear.add(d1);
  const d2=sideCyl(0.33,0.1,shellMat2); d2.position.x=baseX+0.24; ear.add(d2);
  const d3=sideCyl(0.26,0.06,trimMat2); d3.position.x=baseX+0.31; ear.add(d3);
  const fin=new THREE.Mesh(finGeometry(), trimMat2); fin.position.set(baseX+0.14, 0.02, -0.1); fin.rotation.z=-0.22; ear.add(fin);
  fins.push(fin);
  ear.position.y=EY; if (side<0) ear.scale.x=-1;
  return ear;
}
mascot.add(buildEar(1)); mascot.add(buildEar(-1));
mascot.traverse(o => { if (o.isMesh && o.material !== eyeMat2){ o.castShadow = true; o.receiveShadow = true; } });

const FACE_LOCAL = new THREE.Vector3(0, FACE_Y, surfaceZ(0, FACE_Y));
const CAM_FAR = new THREE.Vector3(0, 0.15, 11), LOOK_FAR = new THREE.Vector3(0, 0, 0);
let fly = 0, flyT = 0, spinT = -10, lookX = 0, lookY = 0;
const mouseN = {x:0, y:0};
addEventListener('pointermove', e => { mouseN.x = e.clientX/innerWidth*2-1; mouseN.y = -(e.clientY/innerHeight)*2+1; });

onResize2 = () => {
  camera2.aspect = camera.aspect; camera2.updateProjectionMatrix();
  const w = camera.aspect < 0.9 ? 0.9 : 0.7;
  const h = w*(innerWidth/innerHeight)/LOGO_ASPECT;
  post.uniforms.logoRect.value.set((1-w)/2, 0.5 - h/2, w, h);
};
onResize2();

const _v = new THREE.Vector3(), _l = new THREE.Vector3(), _u = new THREE.Vector3(), _e = new THREE.Euler();
function updatePage2(u, now, dt){
  const arrived = u > 0.995;
  fly = arrived ? Math.min(1, fly + dt*0.6) : Math.max(0, fly - dt*2.5);
  flyT += dt*fly;
  const t = flyT;
  const px = 4.1*Math.sin(0.42*t), py = 1.3*Math.sin(0.77*t) + 0.12*Math.sin(t*2.3), pz = 1.6*Math.sin(0.31*t);
  const vx = 4.1*0.42*Math.cos(0.42*t), vy = 1.3*0.77*Math.cos(0.77*t);
  mascot.position.set(px*fly, py*fly, pz*fly);
  lookX += (mouseN.x - lookX)*0.05; lookY += (mouseN.y - lookY)*0.05;
  const spin = now - spinT < 1.1 ? (1 - Math.cos(Math.min(1,(now - spinT)/1.1)*Math.PI))*Math.PI : 0;
  _e.set((-vy*0.18 - lookY*0.3)*fly, (vx*0.16 + lookX*0.45)*fly, (-vx*0.14)*fly + spin);
  mascot.quaternion.setFromEuler(_e);
  fins.forEach((f, i) => f.rotation.z = -0.22 + Math.sin(now*7 + i)*0.07*fly);
  eyeMat2.opacity = Math.max(0, (fly - 0.3)/0.7);
  const blink = (now % 4.2) < 0.12 ? 0.15 : 1;
  eyes.forEach(e => e.scale.y = blink);

  // camera: starts inside the face screen, pulls back to the wide shot
  mascot.updateMatrixWorld();
  const ez = u*u*(3 - 2*u);
  const d = 0.08*Math.pow(11/0.08, ez);
  _v.copy(FACE_LOCAL).add(new THREE.Vector3(0, 0, d)); mascot.localToWorld(_v);
  _l.copy(FACE_LOCAL); mascot.localToWorld(_l);
  _u.set(0,1,0).applyQuaternion(mascot.quaternion);
  const k = THREE.MathUtils.smoothstep(u, 0.6, 1.0);
  camera2.position.copy(_v).lerp(CAM_FAR, k);
  camera2.up.copy(_u).lerp(new THREE.Vector3(0,1,0), k).normalize();
  camera2.lookAt(_l.lerp(LOOK_FAR, k));

  post.uniforms.fade.value = THREE.MathUtils.smoothstep(u, 0.0, 0.3);
  post.uniforms.logoAlpha.value = THREE.MathUtils.smoothstep(u, 0.45, 1.0);
}

// ---------- Input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0,0,1),0), hitP = new THREE.Vector3();
const homeCam = new THREE.PerspectiveCamera(BASE_FOV, 1, 0.1, 100); homeCam.position.set(0,0,CAM_Z);
function toWorld(cx, cy){
  homeCam.aspect = camera.aspect; homeCam.updateProjectionMatrix(); homeCam.updateMatrixWorld();
  ndc.set(cx/innerWidth*2-1, -(cy/innerHeight)*2+1);
  ray.setFromCamera(ndc, homeCam); ray.ray.intersectPlane(plane, hitP); return hitP.clone();
}
const cursor = {p:new THREE.Vector3(1e4,1e4,0), prev:new THREE.Vector3(), v:new THREE.Vector3(), target:null, active:false, R:1.1};
addEventListener('pointermove', e => {
  const w = toWorld(e.clientX, e.clientY);
  if (!cursor.active) cursor.p.copy(w);
  cursor.target = w; cursor.active = true;
});
document.addEventListener('mouseleave', () => cursor.active = false);
addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') cursor.active = false; });

const shocks = [];
const SHOCK_SPEED = 0.95, SHOCK_LIFE = 1.7;
let shakeT0 = -10, scatterUntil = 0;
addEventListener('pointerdown', e => {
  if (prog > 1.95){ spinT = performance.now()/1000; return; }
  if (prog > 0.05) return;
  const now = performance.now()/1000, c = toWorld(e.clientX, e.clientY);
  shocks.push({u:e.clientX/innerWidth, v:1 - e.clientY/innerHeight, t0:now});
  if (shocks.length > MAXS) shocks.shift();
  const worldSpeed = SHOCK_SPEED*2*halfH;
  for (const b of bodies){
    const d = Math.hypot(b.p.x-c.x, b.p.y-c.y);
    b.hitAt = now + d/worldSpeed; b.hitFrom = c; b.hitDist = d;
  }
  shakeT0 = now; scatterUntil = now + 1.1;
});

// Scroll: 0 = asterisk grid, 1 = black (inside the vortex), 2 = mascot page. No page scrolling.
let progT = 0, prog = 0, snapTimer = 0, lastDir = 1;
const clamp2 = x => Math.max(0, Math.min(2, x));
function nudge(d){
  if (d !== 0) lastDir = Math.sign(d);
  progT = clamp2(progT + d);
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => {
    if (progT < 0.3) progT = 0; else if (progT > 1.7) progT = 2; else progT = lastDir > 0 ? 2 : 0;
  }, 320);
}
addEventListener('wheel', e => { e.preventDefault(); nudge(e.deltaY*0.0014); }, {passive:false});
let ty = null;
addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, {passive:true});
addEventListener('touchmove', e => { if (ty === null) return; const y = e.touches[0].clientY; nudge((ty - y)*0.005); ty = y; e.preventDefault(); }, {passive:false});
addEventListener('touchend', () => ty = null);
addEventListener('keydown', e => {
  if (['ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); progT = 2; }
  if (['ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); progT = 0; }
});

// ---------- Physics (zero-g float) ----------
const tmp = new THREE.Vector3(), n = new THREE.Vector3(), rv = new THREE.Vector3(), qd = new THREE.Quaternion();
const UPRIGHT = new THREE.Quaternion(), Z = new THREE.Vector3(0,0,1);
function step(now){
  const interactive = prog < 0.05;
  if (interactive && cursor.active && cursor.target){ cursor.prev.copy(cursor.p); cursor.p.lerp(cursor.target, 0.5); cursor.v.subVectors(cursor.p, cursor.prev); }
  else { cursor.v.set(0,0,0); cursor.p.set(1e4,1e4,0); }
  const scattering = now < scatterUntil;
  const pull = scattering ? 0.15 : 1;

  for (const b of bodies){
    if (b.hitAt && now >= b.hitAt){
      b.hitAt = 0;
      if (!b.hero){ b.glossy = !b.glossy; b.mesh.material = b.glossy ? glossMat : matteMat; }
      tmp.subVectors(b.p, b.hitFrom); tmp.z = 0;
      if (tmp.lengthSq() < 1e-4) tmp.set(Math.random()-0.5, Math.random()-0.5, 0);
      tmp.normalize();
      const f = (reduce ? 0.08 : 0.32)/(0.8 + b.hitDist*0.12);
      b.v.addScaledVector(tmp, f); b.v.z += f*(Math.random()*0.6 + 0.2);
      b.w.add(new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).multiplyScalar(f*0.5));
    }
    tmp.subVectors(b.home, b.p);
    b.v.addScaledVector(tmp, 0.0016*pull);
    b.v.multiplyScalar(0.985);
    b.w.multiplyScalar(0.985);
  }

  for (let i=0;i<bodies.length;i++){
    const a = bodies[i];
    for (let j=i+1;j<bodies.length;j++){
      const b = bodies[j];
      n.subVectors(b.p, a.p);
      const d = n.length(), min = a.r + b.r;
      if (d >= min || d < 1e-5) continue;
      n.divideScalar(d);
      const ma = a.r*a.r, mb = b.r*b.r, tot = ma+mb, over = min-d;
      a.p.addScaledVector(n, -over*0.5*mb/tot); b.p.addScaledVector(n, over*0.5*ma/tot);
      const rel = rv.subVectors(b.v, a.v).dot(n);
      if (rel < 0){
        const J = -1.3*rel/tot;
        a.v.addScaledVector(n, -J*mb); b.v.addScaledVector(n, J*ma);
        rv.subVectors(b.v, a.v).addScaledVector(n, -rv.dot(n));
        tmp.crossVectors(n, rv).multiplyScalar(0.15);
        a.w.addScaledVector(tmp, -mb/tot); b.w.addScaledVector(tmp, ma/tot);
      }
    }
  }

  const bx = halfW*1.05, by = halfH*1.05;
  for (const b of bodies){
    n.subVectors(b.p, cursor.p);
    const d = n.length(), R = b.r + cursor.R;
    if (d < R && d > 1e-5){
      n.divideScalar(d); const pen = R - d;
      b.v.addScaledVector(n, pen*0.05).addScaledVector(cursor.v, 0.22*pen/R);
      b.w.add(tmp.crossVectors(n, cursor.v).multiplyScalar(-0.6*pen/R));
    }
    b.p.add(b.v);
    if (Math.abs(b.p.x) > bx - b.r){ b.p.x = Math.sign(b.p.x)*(bx - b.r); b.v.x *= -0.5; }
    if (Math.abs(b.p.y) > by - b.r){ b.p.y = Math.sign(b.p.y)*(by - b.r); b.v.y *= -0.5; }
    if (b.p.z > 4){ b.p.z = 4; b.v.z *= -0.5; }
    if (b.p.z < -2.4 + b.r*0.3){ b.p.z = -2.4 + b.r*0.3; b.v.z *= -0.5; }
    b.v.z -= b.p.z*0.0012;
    const ang = b.w.length();
    if (ang > 1e-5){ qd.setFromAxisAngle(tmp.copy(b.w).divideScalar(ang), ang); b.q.premultiply(qd); }
    if (ang < 0.01 && !scattering) b.q.slerp(UPRIGHT, 0.012);
  }
}

// Render transform: physics state + vortex swirl while diving
const qz = new THREE.Quaternion();
function place(e){
  const twist = reduce ? 0 : e*e*3.0;
  for (const b of bodies){
    const r = Math.hypot(b.p.x, b.p.y);
    const a = twist/(0.7 + r*0.18);
    const ca = Math.cos(a), sa = Math.sin(a);
    b.mesh.position.set(b.p.x*ca - b.p.y*sa, b.p.x*sa + b.p.y*ca, b.p.z);
    qz.setFromAxisAngle(Z, a);
    b.mesh.quaternion.multiplyQuaternions(qz, b.q);
  }
}

function loop(){
  const now = performance.now()/1000;
  step(now);

  const dt = Math.min(0.05, now - (loop.last || now)); loop.last = now;
  prog += (progT - prog)*0.045;
  if (Math.abs(progT - prog) < 1e-4) prog = progT;
  const p1 = Math.min(prog, 1), e = p1*p1*(3 - 2*p1);

  if (prog <= 1){
    place(e);
    post.uniforms.vortex.value = e;
    post.uniforms.page2.value = 0; post.uniforms.fade.value = 1;

    for (let i = shocks.length-1; i >= 0; i--) if (now - shocks[i].t0 > SHOCK_LIFE) shocks.splice(i,1);
    const U = post.uniforms.shocks.value;
    for (let i=0;i<MAXS;i++){
      const sh = shocks[i];
      if (!sh){ U[i].set(0,0,0,0); continue; }
      const age = now - sh.t0;
      U[i].set(sh.u, sh.v, age*SHOCK_SPEED, Math.min(1, age*10)*Math.pow(1 - age/SHOCK_LIFE, 1.4)*(reduce ? 0.5 : 1));
    }
    const sa = now - shakeT0;
    const amp = (!reduce && sa < 0.8) ? Math.exp(-sa*8)*0.025 : 0;
    const sx = amp*(Math.sin(now*61.0) + 0.5*Math.sin(now*97.3));
    const sy = amp*(Math.cos(now*53.0) + 0.5*Math.sin(now*83.7));
    camera.position.set(sx, sy, CAM_Z - e*(CAM_Z + 4));
    camera.fov = BASE_FOV + e*38; camera.updateProjectionMatrix();

    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
  } else {
    updatePage2(Math.min(1, prog - 1), now, dt);
    post.uniforms.vortex.value = 0;
    post.uniforms.page2.value = 1;
    post.uniforms.shocks.value.forEach(v => v.set(0,0,0,0));
    renderer.setRenderTarget(rt);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(scene2, camera2);
    renderer.setClearColor(0x000000, 1);
  }
  renderer.setRenderTarget(null);
  post.uniforms.tScene.value = rt.texture;
  renderer.render(postScene, postCam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
